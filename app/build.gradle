plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.dafan.re'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dafan.re'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "4.0"
        ndk { abiFilters "arm64-v8a" }
    }
}


chaquopy {
    defaultConfig {
        version = "3.13"
    }
}
