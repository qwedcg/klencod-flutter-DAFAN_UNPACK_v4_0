name: Build DAFAN-UNPACK APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK package
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build Lua 5.3 and LuaDec for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOL/aarch64-linux-android24-clang"
          export AR="$TOOL/llvm-ar"
          export RANLIB="$TOOL/llvm-ranlib"
          git clone --depth 1 --recurse-submodules https://github.com/viruscamp/luadec.git /tmp/luadec-src
          cd /tmp/luadec-src/lua-5.3/src
          make clean || true
          make generic CC="$CC" AR="$AR rcu" RANLIB="$RANLIB" MYCFLAGS="-fPIC" MYLIBS="-lm -ldl"
          cd /tmp/luadec-src/luadec
          make clean || true
          make luadec LUAVER=5.3 CC="$CC" AR="$AR rcu" RANLIB="$RANLIB" MYCFLAGS="-fPIC" MYLIBS="-lm -ldl"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a"
          cp /tmp/luadec-src/luadec/luadec "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luadec"
          cp /tmp/luadec-src/lua-5.3/src/luac "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luac5.3"
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luadec" "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luac5.3"
          file "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luadec" "$GITHUB_WORKSPACE/app/src/main/assets/bin/arm64-v8a/luac5.3"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAFAN-UNPACK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
